components:
  schemas:
    Adicional:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
        preco:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Preço (R$)
        produto:
          type: integer
      required:
      - id
      - nome
      - preco
      - produto
    BlankEnum:
      enum:
      - ''
    Categoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
        ordem:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          title: Ordem de Exibição
      required:
      - id
      - nome
    CategoriaComProdutos:
      type: object
      description: Serializer para exibir o cardápio completo agrupado por categoria.
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
        ordem:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          title: Ordem de Exibição
        produtos:
          type: array
          items:
            $ref: '#/components/schemas/Produto'
          readOnly: true
      required:
      - id
      - nome
      - produtos
    Conta:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sessao:
          type: integer
          readOnly: true
          title: Sessão
        mesa_numero:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
          title: Número da Mesa
          readOnly: true
        valor_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          title: Valor Total (R$)
        meio_pagamento:
          title: Meio de Pagamento
          oneOf:
          - $ref: '#/components/schemas/MeioPagamentoEnum'
          - $ref: '#/components/schemas/BlankEnum'
        pago:
          type: boolean
          readOnly: true
        pago_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - criado_em
      - id
      - mesa_numero
      - pago
      - pago_em
      - sessao
      - valor_total
    ContaMesa:
      type: object
      properties:
        mesa:
          $ref: '#/components/schemas/MesaCliente'
        sessao_id:
          type: integer
        pedidos:
          type: array
          items:
            $ref: '#/components/schemas/Pedido'
        valor_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        conta_solicitada:
          type: boolean
      required:
      - conta_solicitada
      - mesa
      - pedidos
      - sessao_id
      - valor_total
    Cozinha:
      type: object
      properties:
        RECEBIDO:
          type: array
          items:
            $ref: '#/components/schemas/PedidoCozinha'
        EM_PREPARACAO:
          type: array
          items:
            $ref: '#/components/schemas/PedidoCozinha'
        PRONTO:
          type: array
          items:
            $ref: '#/components/schemas/PedidoCozinha'
      required:
      - EM_PREPARACAO
      - PRONTO
      - RECEBIDO
    Garcom:
      type: object
      properties:
        pedidos_prontos:
          type: array
          items:
            $ref: '#/components/schemas/Pedido'
        mesas_aguardando_conta:
          type: array
          items:
            $ref: '#/components/schemas/Mesa'
      required:
      - mesas_aguardando_conta
      - pedidos_prontos
    ItemPedido:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        produto:
          type: integer
        produto_nome:
          type: string
          readOnly: true
        quantidade:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        preco_unitario:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          title: Preço Unitário (gravado)
        observacao:
          type: string
          title: Observação do Item
          maxLength: 255
        itens_adicionais:
          type: array
          items:
            $ref: '#/components/schemas/ItemPedidoAdicional'
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - itens_adicionais
      - preco_unitario
      - produto
      - produto_nome
      - subtotal
    ItemPedidoAdicional:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        adicional:
          type: integer
        nome:
          type: string
          readOnly: true
        preco:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          title: Preço do Adicional (gravado)
      required:
      - adicional
      - id
      - nome
      - preco
    ItemPedidoCriar:
      type: object
      description: Serializer para criar item dentro de um pedido (nested).
      properties:
        produto_id:
          type: integer
        quantidade:
          type: integer
          maximum: 99
          minimum: 1
          default: 1
        observacao:
          type: string
          default: ''
          maxLength: 255
        adicionais_ids:
          type: array
          items:
            type: integer
      required:
      - produto_id
    MeioPagamentoEnum:
      enum:
      - PIX
      - CARTAO
      - DINHEIRO
      type: string
      description: |-
        * `PIX` - Pix
        * `CARTAO` - Cartão
        * `DINHEIRO` - Dinheiro no Caixa
    Mensagem:
      type: object
      properties:
        mensagem:
          type: string
      required:
      - mensagem
    Mesa:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        numero:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
          title: Número da Mesa
        token_uuid:
          type: string
          format: uuid
          readOnly: true
        ativa:
          type: boolean
          title: Mesa Ativa
        qr_code:
          type: string
          readOnly: true
        status:
          type: string
          description: Retorna o status visual da mesa.
          readOnly: true
        sessao_ativa_id:
          type: integer
          nullable: true
          readOnly: true
      required:
      - id
      - numero
      - qr_code
      - sessao_ativa_id
      - status
      - token_uuid
    MesaCliente:
      type: object
      description: Serializer para o cliente — não expõe dados sensíveis.
      properties:
        id:
          type: integer
          readOnly: true
        numero:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
          title: Número da Mesa
        status:
          type: string
          description: Retorna o status visual da mesa.
          readOnly: true
      required:
      - id
      - numero
      - status
    MesaContexto:
      type: object
      description: Serializer para o cliente — não expõe dados sensíveis.
      properties:
        id:
          type: integer
          readOnly: true
        numero:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
          title: Número da Mesa
        status:
          type: string
          description: Retorna o status visual da mesa.
          readOnly: true
        sessao_ativa:
          type: boolean
        sessao_id:
          type: integer
          nullable: true
      required:
      - id
      - numero
      - sessao_ativa
      - sessao_id
      - status
    Pagamento:
      type: object
      description: Serializer para processar pagamento simulado.
      properties:
        meio_pagamento:
          $ref: '#/components/schemas/MeioPagamentoEnum'
      required:
      - meio_pagamento
    PagamentoResultado:
      type: object
      properties:
        mensagem:
          type: string
        conta:
          $ref: '#/components/schemas/Conta'
      required:
      - conta
      - mensagem
    PaginatedAdicionalList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Adicional'
    PaginatedCategoriaList:
      type: object
