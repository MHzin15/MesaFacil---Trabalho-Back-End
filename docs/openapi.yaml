    get:
      operationId: admin_pedidos_list
      description: RF25 — Consulta de pedidos com filtros por data.
      parameters:
      - in: query
        name: data_fim
        schema:
          type: string
          format: date
      - in: query
        name: data_inicio
        schema:
          type: string
          format: date
      - in: query
        name: status
        schema:
          type: string
          enum:
          - A_CAMINHO
          - CANCELADO
          - EM_PREPARACAO
          - ENTREGUE
          - PRONTO
          - RECEBIDO
      tags:
      - admin
      security:
      - cookieAuth: []
