  /api/admin/contas/:
    get:
      operationId: admin_contas_list
      description: RF25 — Consulta de contas fechadas com filtros por data.
      parameters:
      - in: query
        name: data_fim
        schema:
          type: string
          format: date
      - in: query
        name: data_inicio
        schema:
          type: string
          format: date
      tags:
