openapi: 3.0.3
info:
  title: MesaFácil API
  version: 1.0.0
  description: API REST do sistema MesaFácil — Pedidos por QR Code
paths:
  /api/adicionais/:
    get:
      operationId: adicionais_list
      description: CRUD de adicionais. Leitura pública, escrita para Admin.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - adicionais
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdicionalList'
          description: ''
    post:
      operationId: adicionais_create
      description: CRUD de adicionais. Leitura pública, escrita para Admin.
      tags:
      - adicionais
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Adicional'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Adicional'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Adicional'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adicional'
          description: ''
  /api/adicionais/{id}/:
    get:
      operationId: adicionais_retrieve
      description: CRUD de adicionais. Leitura pública, escrita para Admin.
      parameters:
      - in: path
        name: id
