services:
  - type: web
    name: mesafacil
    runtime: python
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: commit
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mesafacil-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: mesafacil-db
    plan: free
    region: virginia
    postgresMajorVersion: "18"
    databaseName: mesafacil
    user: mesafacil
    ipAllowList: []
