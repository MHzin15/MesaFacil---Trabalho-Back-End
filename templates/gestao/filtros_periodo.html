<form method="get" class="g-filters g-periodo">{{ form.non_field_errors }}{% for field in form %}<div><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button class="btn btn-primary" type="submit">Aplicar período</button>{% if section == 'relatorios' %}<button class="btn btn-outline-primary" type="submit" name="exportar" value="csv">Baixar CSV</button>{% endif %}</form>
