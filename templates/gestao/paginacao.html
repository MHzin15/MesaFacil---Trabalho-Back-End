{% if pagina.paginator.num_pages > 1 %}<nav class="g-pagination" aria-label="Paginação"><span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }} · {{ pagina.paginator.count }} registros</span><div>{% if pagina.has_previous %}<a class="btn btn-outline-primary" href="?{{ filtros_url }}&amp;page={{ pagina.previous_page_number }}">← Anterior</a>{% endif %}{% if pagina.has_next %}<a class="btn btn-outline-primary" href="?{{ filtros_url }}&amp;page={{ pagina.next_page_number }}">Próxima →</a>{% endif %}</div></nav>{% endif %}
